name: Backend CI

on:
  push:
    paths:
      - 'Backend/**'
  pull_request:
    paths:
      - 'Backend/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          check-latest: true

      - name: Force Maven toolchain to JDK 21
        run: |
          mkdir -p Backend/.mvn
          cat > Backend/.mvn/toolchains.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 https://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>21</version>
              </provides>
              <configuration>
                <jdkHome>${env.JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Show Java environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java || true
          readlink -f "$(which java)" || true
          java -version
          javac -version
          Backend/mvnw -v

      - name: Validate Maven Wrapper
        run: |
          chmod +x Backend/mvnw
          Backend/mvnw -v

      - name: Resolve dependencies
        run: Backend/mvnw -B -e -X -f Backend/pom.xml -Djava.version=21 -Dmaven.compiler.release=21 -Dmaven.compiler.source=21 -Dmaven.compiler.target=21 dependency:go-offline

      - name: Run tests
        run: Backend/mvnw -B -e -X -f Backend/pom.xml -Djava.version=21 -Dmaven.compiler.release=21 -Dmaven.compiler.source=21 -Dmaven.compiler.target=21 test

      - name: Package (skip tests)
        if: always()
        run: Backend/mvnw -B -e -X -f Backend/pom.xml -Djava.version=21 -Dmaven.compiler.release=21 -Dmaven.compiler.source=21 -Dmaven.compiler.target=21 -DskipTests package


